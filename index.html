<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coagulation Stock Tracker</title>
<style>
  :root {
    --ink: #12302f;
    --teal: #0f4c4c;
    --teal-light: #e3efec;
    --line: #d5dedc;
    --muted: #5b6b6b;
    --bg: #f5f7f6;
    --card: #ffffff;
    --danger-bg: #fdeceb;
    --danger-ink: #9a3b34;
    --warn-bg: #fdf3e3;
    --warn-ink: #8a5a12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--teal);
    padding: 16px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand svg { flex-shrink: 0; }
  .brand-text { min-width: 0; }
  .title { color: #fff; font-size: 16px; font-weight: 600; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subtitle { color: #a8c4c0; font-size: 11.5px; margin-top: 1px; }
  .icon-btn {
    background: rgba(255,255,255,0.12);
    border: none; border-radius: 8px; width: 34px; height: 34px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn svg { stroke: #fff; }
  .notice {
    margin-top: 10px; font-size: 11.5px; color: #dcece9;
    background: rgba(255,255,255,0.08); border-radius: 6px; padding: 7px 9px; line-height: 1.45;
  }
  main { padding: 14px 12px 90px; max-width: 640px; margin: 0 auto; }
  .hidden { display: none !important; }

  .tile-grid { display: flex; flex-direction: column; gap: 12px; }
  .tile {
    background: var(--card); border: 1px solid #e4eae8; border-radius: 14px;
    padding: 16px; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; box-shadow: 0 1px 2px rgba(15,76,76,0.08);
  }
  .tile-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .tile-icon {
    width: 42px; height: 42px; border-radius: 10px; background: var(--teal-light);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .tile-name { font-size: 15.5px; font-weight: 700; color: var(--ink); }
  .tile-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile-badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tile-badge {
    font-size: 10.5px; font-weight: 700; border-radius: 20px; padding: 3px 8px;
  }
  .tile-badge.low { background: var(--danger-bg); color: var(--danger-ink); }
  .tile-badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chevron { color: #b7c2c1; flex-shrink: 0; margin-left: 6px; display: flex; }

  .list-header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .back-btn {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .list-title { font-size: 17px; font-weight: 700; color: var(--ink); }

  .search-wrap { margin-bottom: 10px; }
  #search-box {
    width: 100%; font-size: 15px; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #fff; color: #22302f;
  }
  .banner { font-size: 13px; padding: 9px 11px; border-radius: 8px; margin-bottom: 10px; }
  .banner.error { background: var(--danger-bg); color: var(--danger-ink); }
  .banner.info { background: var(--teal-light); color: var(--teal); }
  .center-row {
    display: flex; align-items: center; justify-content: center;
    padding: 40px 0; color: var(--muted); font-size: 13.5px; gap: 8px;
  }
  .empty { text-align: center; padding: 50px 20px; }
  .empty .h { font-size: 15px; color: #3a4444; margin-bottom: 4px; }
  .empty .s { font-size: 13px; color: #8a9595; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(15,76,76,0.08); border: 1px solid #e4eae8;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .item-name { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.1px; }
  .vendor { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .pack-size { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .stat-row { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .stat { font-size: 12.5px; }
  .stat .k { color: #9aa9a8; font-weight: 600; }
  .stat .v { color: #374242; font-weight: 600; }
  .expiry-tag {
    font-size: 11px; font-weight: 700; border-radius: 5px; padding: 3px 7px;
    margin-top: 8px; margin-right: 6px; display: inline-block;
  }
  .expiry-tag.ok { background: var(--teal-light); color: var(--teal); }
  .expiry-tag.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .expiry-tag.expired { background: var(--danger-bg); color: var(--danger-ink); }
  .stock-tag {
    font-size: 11px; font-weight: 700; border-radius: 5px; padding: 3px 7px;
    margin-top: 8px; margin-right: 6px; display: inline-block;
  }
  .stock-tag.low { background: var(--danger-bg); color: var(--danger-ink); }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .chip-btn {
    font-size: 12px; font-weight: 600; border-radius: 7px; padding: 6px 12px;
    border: 1px solid var(--line); background: #fff; color: var(--teal); cursor: pointer;
  }
  .chip-btn.danger { color: var(--danger-ink); border-color: #f0d3d0; }
  .doc-file-link {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    color: var(--teal); margin-top: 8px; text-decoration: none;
  }
  .doc-amount { font-size: 13px; color: #374242; font-weight: 600; margin-top: 4px; }
  .doc-date { font-size: 11.5px; color: var(--muted); }

  .fab {
    position: fixed; bottom: 20px; right: 18px; width: 54px; height: 54px;
    border-radius: 27px; background: var(--teal); border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(15,76,76,0.35); cursor: pointer;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(15,30,29,0.4);
    display: flex; align-items: flex-end; z-index: 10;
  }
  .overlay.hidden { display: none; }
  .sheet {
    background: #fff; width: 100%; border-radius: 16px 16px 0 0;
    padding: 16px 16px 28px; max-height: 88vh; overflow-y: auto;
    margin: 0 auto; max-width: 640px;
  }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .sheet-title { font-size: 16px; font-weight: 600; color: var(--ink); }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; font-size: 12.5px; color: #4a5555; font-weight: 600; gap: 5px; }
  input, textarea, select {
    font: inherit; font-size: 15px; padding: 10px 10px; border-radius: 8px;
    border: 1px solid var(--line); color: #22302f; font-weight: 400; width: 100%;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--teal); outline-offset: 1px;
  }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .save-btn {
    margin-top: 6px; background: var(--teal); color: #fff; border: none;
    border-radius: 9px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .save-btn:disabled { opacity: 0.6; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6.5a4 4 0 0 1-1 2.5L3.5 16A3 3 0 0 0 6 21h12a3 3 0 0 0 2.5-5l-4.5-5a4 4 0 0 1-1-2.5V2"/><path d="M6 2h12"/><path d="M7 15h10"/></svg>
      <div class="brand-text">
        <div class="title" id="header-title">Coagulation Stock</div>
        <div class="subtitle" id="header-subtitle">Reagents &amp; consumables tracker</div>
      </div>
    </div>
    <button class="icon-btn" onclick="loadItems()" aria-label="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>
  <div class="notice">
    Prototype — link isn't login-protected. Expiry tags marked "Expiring soon" are within 60 days.
  </div>
</header>

<main>
  <div id="banner-area"></div>

  <div id="home-view">
    <div id="tile-area">
      <div class="center-row">Loading equipment…</div>
    </div>
  </div>

  <div id="equipment-view" class="hidden">
    <div class="list-header-row">
      <button class="back-btn" onclick="showHome()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f4c4c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="list-title" id="equipment-title">Analyzer</div>
    </div>
    <div class="tile-grid" id="category-tiles"></div>
  </div>

  <div id="list-view" class="hidden">
    <div class="list-header-row">
      <button class="back-btn" onclick="showEquipment(currentAnalyzer)" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f4c4c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="list-title" id="list-title">Analyzer</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="search-box" placeholder="Search by item, vendor…" />
    </div>
    <div id="list-area">
      <div class="center-row">Loading stock…</div>
    </div>
  </div>

  <div id="doc-view" class="hidden">
    <div class="list-header-row">
      <button class="back-btn" onclick="showEquipment(currentAnalyzer)" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f4c4c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="list-title" id="doc-title">Purchase Requests</div>
    </div>
    <div id="doc-list-area">
      <div class="center-row">Loading…</div>
    </div>
  </div>
</main>

<button class="fab" id="fab-btn" onclick="handleFabClick()" aria-label="New">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="overlay hidden" id="overlay" onclick="closeFormBg(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-header">
      <span class="sheet-title" id="sheet-title">New item</span>
      <button class="icon-btn" style="background:#eef2f1;" onclick="closeForm()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="item-form">
      <label>Analyzer *
        <input type="text" id="analyzer" placeholder="e.g. Stago Coagulometer" required />
      </label>
      <label>Vendor
        <input type="text" id="vendor" placeholder="e.g. LabX, Trivandrum" />
      </label>
      <label>Item name *
        <input type="text" id="itemName" placeholder="e.g. STA Neoptimal 10" required />
      </label>
      <label>Pack size / description
        <input type="text" id="packSize" placeholder="e.g. 1 kit (12x10 ml)" />
      </label>
      <div class="row-2">
        <label>Usage / week
          <input type="text" id="usageWeek" placeholder="e.g. 7 vial" />
        </label>
        <label>In stock
          <input type="text" id="inStock" placeholder="e.g. 8" />
        </label>
      </div>
      <label>Reorder level
        <input type="text" id="reorderLevel" placeholder="Flag as low stock at or below this number" />
      </label>
      <div class="row-2">
        <label>To get
          <input type="text" id="toGet" placeholder="e.g. 3 kit" />
        </label>
        <label>To give back
          <input type="text" id="toGiveBack" placeholder="e.g. 4" />
        </label>
      </div>
      <label>Expiry
        <input type="text" id="expiry" placeholder="e.g. 31.10.26 or No expiry" />
      </label>
      <button type="submit" class="save-btn" id="save-btn">Save item</button>
    </form>
  </div>
</div>

<div class="overlay hidden" id="doc-overlay" onclick="closeDocFormBg(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-header">
      <span class="sheet-title" id="doc-sheet-title">New entry</span>
      <button class="icon-btn" style="background:#eef2f1;" onclick="closeDocForm()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="doc-form">
      <label>Date
        <input type="date" id="docDate" />
      </label>
      <label>Description *
        <input type="text" id="docDescription" placeholder="e.g. Reorder of STA Cuvette, 2 boxes" required />
      </label>
      <label>Amount
        <input type="text" id="docAmount" placeholder="e.g. 12500" inputmode="decimal" />
      </label>
      <label>Attach PDF
        <input type="file" id="docFile" accept="application/pdf" />
        <span style="font-size:11px; color:#8a9595; font-weight:400;">Leave blank when editing to keep the current attachment.</span>
      </label>
      <button type="submit" class="save-btn" id="doc-save-btn">Save entry</button>
    </form>
  </div>
</div>

<script>
  // ================================================================
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE. It looks like:
  // https://script.google.com/macros/s/XXXXXXXXXXXX/exec
  // ================================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbym6b6pcEOMUyGLL6WSptOUQ6TjPZhqQlYd2SPUG8T5HQ5VEF3J2vPoc_A99f4wB689jA/exec";
  const WARN_DAYS = 60;

  const bannerArea = document.getElementById("banner-area");
  const homeView = document.getElementById("home-view");
  const equipmentView = document.getElementById("equipment-view");
  const listView = document.getElementById("list-view");
  const docView = document.getElementById("doc-view");
  const tileArea = document.getElementById("tile-area");
  const categoryTiles = document.getElementById("category-tiles");
  const equipmentTitle = document.getElementById("equipment-title");
  const listArea = document.getElementById("list-area");
  const listTitle = document.getElementById("list-title");
  const docListArea = document.getElementById("doc-list-area");
  const docTitle = document.getElementById("doc-title");
  const headerTitle = document.getElementById("header-title");
  const headerSubtitle = document.getElementById("header-subtitle");
  const overlay = document.getElementById("overlay");
  const form = document.getElementById("item-form");
  const saveBtn = document.getElementById("save-btn");
  const docOverlay = document.getElementById("doc-overlay");
  const docForm = document.getElementById("doc-form");
  const docSaveBtn = document.getElementById("doc-save-btn");
  const searchBox = document.getElementById("search-box");
  let allItems = [];
  let allDocs = [];
  let editingId = null;
  let editingDocId = null;
  let currentAnalyzer = null;
  let currentView = "home"; // home | equipment | stock-list | doc-list
  let currentCategory = null;
  const CATEGORIES = [
    { key: "Purchase Request", label: "Purchase Requests" },
    { key: "Supply Order", label: "Supply Orders" },
    { key: "Purchase Bill", label: "Purchase Bills" },
  ];

  function showBanner(msg, type) {
    bannerArea.innerHTML = '<div class="banner ' + type + '">' + msg + "</div>";
  }
  function clearBanner() {
    bannerArea.innerHTML = "";
  }
  function escapeHtml(str) {
    const d = document.createElement("div");
    d.innerText = str == null ? "" : String(str);
    return d.innerHTML;
  }

  function parseExpiry(str) {
    if (!str) return null;
    const s = String(str).trim();
    const m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
    if (!m) return null;
    let day = parseInt(m[1], 10);
    let month = parseInt(m[2], 10) - 1;
    let year = parseInt(m[3], 10);
    if (year < 100) year += 2000;
    const d = new Date(year, month, day);
    if (isNaN(d.getTime())) return null;
    return d;
  }

  function expiryStatus(expiryStr) {
    const d = parseExpiry(expiryStr);
    if (!d) return "ok";
    const daysLeft = Math.floor((d.getTime() - Date.now()) / 86400000);
    if (daysLeft < 0) return "expired";
    if (daysLeft <= WARN_DAYS) return "warn";
    return "ok";
  }

  function expiryTag(expiryStr) {
    const status = expiryStatus(expiryStr);
    const label = expiryStr ? escapeHtml(expiryStr) : "No expiry set";
    if (status === "expired") return '<span class="expiry-tag expired">Expired &middot; ' + label + "</span>";
    if (status === "warn") return '<span class="expiry-tag warn">Expiring soon &middot; ' + label + "</span>";
    return '<span class="expiry-tag ok">Expiry: ' + label + "</span>";
  }

  function parseLeadingNumber(str) {
    if (!str) return null;
    const m = String(str).trim().match(/^-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }

  function isLowStock(inStock, reorderLevel) {
    const stockNum = parseLeadingNumber(inStock);
    const reorderNum = parseLeadingNumber(reorderLevel);
    if (stockNum === null || reorderNum === null) return false;
    return stockNum <= reorderNum;
  }

  function stockTag(inStock, reorderLevel) {
    return isLowStock(inStock, reorderLevel) ? '<span class="stock-tag low">Low stock</span>' : "";
  }

  async function loadItems() {
    if (SCRIPT_URL.indexOf("PASTE_YOUR_SCRIPT_URL_HERE") !== -1) {
      showBanner("Setup needed: paste your Google Apps Script URL into index.html (see SCRIPT_URL near the top of the script).", "error");
      return;
    }
    if (currentView === "home") tileArea.innerHTML = '<div class="center-row">Loading equipment…</div>';
    if (currentView === "stock-list") listArea.innerHTML = '<div class="center-row">Loading stock…</div>';
    if (currentView === "doc-list") docListArea.innerHTML = '<div class="center-row">Loading…</div>';
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Unknown error");
      allItems = data.items || [];
      allDocs = data.documents || [];
      clearBanner();
      render();
    } catch (err) {
      showBanner("Couldn't load data. Check your connection and try refreshing.", "error");
      tileArea.innerHTML = "";
      listArea.innerHTML = "";
      docListArea.innerHTML = "";
    }
  }

  function render() {
    if (currentView === "home") renderHome();
    else if (currentView === "equipment") renderEquipment();
    else if (currentView === "stock-list") renderListView();
    else if (currentView === "doc-list") renderDocList();
  }

  function setView(v) {
    currentView = v;
    homeView.classList.toggle("hidden", v !== "home");
    equipmentView.classList.toggle("hidden", v !== "equipment");
    listView.classList.toggle("hidden", v !== "stock-list");
    docView.classList.toggle("hidden", v !== "doc-list");
    const fabBtn = document.getElementById("fab-btn");
    fabBtn.style.display = (v === "stock-list" || v === "doc-list") ? "flex" : "none";
  }

  function handleFabClick() {
    if (currentView === "stock-list") openForm();
    else if (currentView === "doc-list") openDocForm();
  }

  function showHome() {
    currentAnalyzer = null;
    currentCategory = null;
    headerTitle.textContent = "Coagulation Stock";
    headerSubtitle.textContent = "Reagents & consumables tracker";
    setView("home");
    render();
  }

  function showEquipment(analyzer) {
    currentAnalyzer = analyzer;
    currentCategory = null;
    headerTitle.textContent = analyzer;
    headerSubtitle.textContent = "Choose a section";
    equipmentTitle.textContent = analyzer;
    setView("equipment");
    render();
  }

  function showList(analyzer) {
    currentAnalyzer = analyzer;
    if (searchBox) searchBox.value = "";
    headerTitle.textContent = analyzer;
    headerSubtitle.textContent = "Tap + to add an item here";
    listTitle.textContent = analyzer + " · Stock";
    setView("stock-list");
    render();
  }

  function showDocList(category) {
    currentCategory = category;
    const label = CATEGORIES.find(function (c) { return c.key === category; }).label;
    headerTitle.textContent = currentAnalyzer;
    headerSubtitle.textContent = label;
    docTitle.textContent = currentAnalyzer + " · " + label;
    setView("doc-list");
    render();
  }

  function renderEquipment() {
    const scoped = allItems.filter(function (it) { return (it.Analyzer || "Other") === currentAnalyzer; });
    const lowCount = scoped.filter(function (it) { return isLowStock(it.InStock, it.ReorderLevel); }).length;
    const warnCount = scoped.filter(function (it) { return expiryStatus(it.Expiry) !== "ok"; }).length;

    let html = "";
    html += '<div class="tile" onclick="showList(\'' + escapeHtml(currentAnalyzer).replace(/'/g, "&#39;") + '\')">';
    html += '<div class="tile-left"><div class="tile-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f4c4c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6.5a4 4 0 0 1-1 2.5L3.5 16A3 3 0 0 0 6 21h12a3 3 0 0 0 2.5-5l-4.5-5a4 4 0 0 1-1-2.5V2"/><path d="M6 2h12"/></svg></div>';
    html += '<div><div class="tile-name">Stock</div><div class="tile-count">' + scoped.length + (scoped.length === 1 ? " item" : " items") + "</div></div></div>";
    html += '<div class="tile-badges">';
    if (lowCount) html += '<span class="tile-badge low">' + lowCount + " low</span>";
    if (warnCount) html += '<span class="tile-badge warn">' + warnCount + " expiry</span>";
    html += '<span class="chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></div></div>';

    CATEGORIES.forEach(function (c) {
      const count = allDocs.filter(function (d) { return (d.Analyzer || "") === currentAnalyzer && d.Category === c.key; }).length;
      html += '<div class="tile" onclick="showDocList(\'' + c.key + '\')">';
      html += '<div class="tile-left"><div class="tile-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f4c4c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>';
      html += '<div><div class="tile-name">' + c.label + '</div><div class="tile-count">' + count + (count === 1 ? " entry" : " entries") + "</div></div></div>";
      html += '<div class="tile-badges"><span class="chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></div></div>';
    });
    categoryTiles.innerHTML = html;
  }

  function formatDisplayDate(str) {
    if (!str) return "";
    const d = new Date(str);
    if (isNaN(d.getTime())) return escapeHtml(str);
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }

  function toDateInputValue(str) {
    if (!str) return "";
    const d = new Date(str);
    if (isNaN(d.getTime())) return "";
    const pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function renderDocList() {
    const docs = allDocs.filter(function (d) { return (d.Analyzer || "") === currentAnalyzer && d.Category === currentCategory; });
    if (!docs.length) {
      docListArea.innerHTML = '<div class="empty"><div class="h">No entries yet</div><div class="s">Tap the + button to add the first one.</div></div>';
      return;
    }
    docs.sort(function (a, b) { return new Date(b.Timestamp) - new Date(a.Timestamp); });
    let html = '<div class="list">';
    docs.forEach(function (d) {
      html += '<div class="card">';
      html += '<div class="item-name">' + escapeHtml(d.Description) + "</div>";
      if (d.Date) html += '<div class="doc-date">' + formatDisplayDate(d.Date) + "</div>";
      if (d.Amount) html += '<div class="doc-amount">₹ ' + escapeHtml(d.Amount) + "</div>";
      if (d.FileUrl) {
        html += '<a class="doc-file-link" href="' + escapeHtml(d.FileUrl) + '" target="_blank" rel="noopener">';
        html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
        html += escapeHtml(d.FileName || "View PDF") + "</a>";
      }
      if (d.ID) {
        html += '<div class="card-actions">';
        html += '<button type="button" class="chip-btn" onclick="startEditDoc(\'' + escapeHtml(d.ID) + '\')">Edit</button>';
        html += '<button type="button" class="chip-btn danger" onclick="confirmDeleteDoc(\'' + escapeHtml(d.ID) + '\')">Delete</button>';
        html += "</div>";
      }
      html += "</div>";
    });
    html += "</div>";
    docListArea.innerHTML = html;
  }

  function renderHome() {
    if (!allItems.length) {
      tileArea.innerHTML = '<div class="empty"><div class="h">No equipment yet</div><div class="s">Tap the + button to add your first item — you will name the analyzer as you go.</div></div>';
      return;
    }
    const groups = [];
    const groupIndex = {};
    allItems.forEach(function (it) {
      const key = it.Analyzer || "Other";
      if (!(key in groupIndex)) {
        groupIndex[key] = groups.length;
        groups.push({ name: key, items: [] });
      }
      groups[groupIndex[key]].items.push(it);
    });

    let html = '<div class="tile-grid">';
    groups.forEach(function (g) {
      const lowCount = g.items.filter(function (it) { return isLowStock(it.InStock, it.ReorderLevel); }).length;
      const warnCount = g.items.filter(function (it) { return expiryStatus(it.Expiry) !== "ok"; }).length;
      const safeName = escapeHtml(g.name).replace(/'/g, "&#39;");
      html += '<div class="tile" onclick="showEquipment(\'' + safeName + '\')">';
      html += '<div class="tile-left">';
      html += '<div class="tile-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f4c4c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6.5a4 4 0 0 1-1 2.5L3.5 16A3 3 0 0 0 6 21h12a3 3 0 0 0 2.5-5l-4.5-5a4 4 0 0 1-1-2.5V2"/><path d="M6 2h12"/></svg></div>';
      html += '<div><div class="tile-name">' + escapeHtml(g.name) + '</div><div class="tile-count">' + g.items.length + (g.items.length === 1 ? " item" : " items") + "</div></div>";
      html += "</div>";
      html += '<div class="tile-badges">';
      if (lowCount) html += '<span class="tile-badge low">' + lowCount + " low</span>";
      if (warnCount) html += '<span class="tile-badge warn">' + warnCount + " expiry</span>";
      html += '<span class="chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>';
      html += "</div></div>";
    });
    html += "</div>";
    tileArea.innerHTML = html;
  }

  function applyFilter() {
    const q = searchBox.value.trim().toLowerCase();
    const scoped = allItems.filter(function (it) { return (it.Analyzer || "Other") === currentAnalyzer; });
    if (!q) {
      renderListInner(scoped);
      return;
    }
    const filtered = scoped.filter(function (it) {
      const haystack = [it.Vendor, it.ItemName, it.PackSize]
        .map(function (v) { return (v == null ? "" : String(v)).toLowerCase(); }).join(" ");
      return haystack.indexOf(q) !== -1;
    });
    renderListInner(filtered);
  }
  searchBox.addEventListener("input", applyFilter);

  function renderListView() {
    applyFilter();
  }

  function renderListInner(items) {
    const scopedAll = allItems.filter(function (it) { return (it.Analyzer || "Other") === currentAnalyzer; });
    if (!items.length) {
      if (scopedAll.length && searchBox.value.trim()) {
        listArea.innerHTML = '<div class="empty"><div class="h">No matches</div><div class="s">Try a different search term.</div></div>';
      } else {
        listArea.innerHTML = '<div class="empty"><div class="h">No items yet</div><div class="s">Tap the + button to add the first item here.</div></div>';
      }
      return;
    }
    let html = '<div class="list">';
    items.forEach(function (it) {
      html += '<div class="card">';
      html += '<div class="card-top"><div>';
      html += '<div class="item-name">' + escapeHtml(it.ItemName) + "</div>";
      if (it.Vendor) html += '<div class="vendor">' + escapeHtml(it.Vendor) + "</div>";
      html += "</div></div>";
      if (it.PackSize) html += '<div class="pack-size">' + escapeHtml(it.PackSize) + "</div>";
      html += '<div class="stat-row">';
      if (it.InStock !== "" && it.InStock != null) html += '<div class="stat"><span class="k">In stock:</span> <span class="v">' + escapeHtml(it.InStock) + "</span></div>";
      if (it.UsageWeek) html += '<div class="stat"><span class="k">Usage/wk:</span> <span class="v">' + escapeHtml(it.UsageWeek) + "</span></div>";
      if (it.ToGet) html += '<div class="stat"><span class="k">To get:</span> <span class="v">' + escapeHtml(it.ToGet) + "</span></div>";
      if (it.ToGiveBack) html += '<div class="stat"><span class="k">To give back:</span> <span class="v">' + escapeHtml(it.ToGiveBack) + "</span></div>";
      if (it.ReorderLevel) html += '<div class="stat"><span class="k">Reorder at:</span> <span class="v">' + escapeHtml(it.ReorderLevel) + "</span></div>";
      html += "</div>";
      html += stockTag(it.InStock, it.ReorderLevel) + expiryTag(it.Expiry);
      if (it.ID) {
        html += '<div class="card-actions">';
        html += '<button type="button" class="chip-btn" onclick="startEdit(\'' + escapeHtml(it.ID) + '\')">Edit</button>';
        html += '<button type="button" class="chip-btn danger" onclick="confirmDelete(\'' + escapeHtml(it.ID) + '\')">Delete</button>';
        html += "</div>";
      }
      html += "</div>";
    });
    html += "</div>";
    listArea.innerHTML = html;
  }

  function openForm() {
    editingId = null;
    document.getElementById("sheet-title").textContent = "New item";
    saveBtn.textContent = "Save item";
    form.reset();
    if (currentAnalyzer !== null) {
      document.getElementById("analyzer").value = currentAnalyzer;
    }
    overlay.classList.remove("hidden");
    document.getElementById(currentAnalyzer !== null ? "itemName" : "analyzer").focus();
  }
  function closeForm() {
    overlay.classList.add("hidden");
    form.reset();
    editingId = null;
    document.getElementById("sheet-title").textContent = "New item";
    saveBtn.textContent = "Save item";
  }
  function closeFormBg(e) {
    if (e.target === overlay) closeForm();
  }

  function startEdit(id) {
    const it = allItems.find(function (x) { return String(x.ID) === String(id); });
    if (!it) return;
    editingId = id;
    document.getElementById("analyzer").value = it.Analyzer || "";
    document.getElementById("vendor").value = it.Vendor || "";
    document.getElementById("itemName").value = it.ItemName || "";
    document.getElementById("packSize").value = it.PackSize || "";
    document.getElementById("usageWeek").value = it.UsageWeek || "";
    document.getElementById("inStock").value = it.InStock || "";
    document.getElementById("reorderLevel").value = it.ReorderLevel || "";
    document.getElementById("toGet").value = it.ToGet || "";
    document.getElementById("toGiveBack").value = it.ToGiveBack || "";
    document.getElementById("expiry").value = it.Expiry || "";
    document.getElementById("sheet-title").textContent = "Edit item";
    saveBtn.textContent = "Update item";
    overlay.classList.remove("hidden");
  }

  async function confirmDelete(id) {
    if (!confirm("Delete this item? This can't be undone.")) return;
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "delete", id: id }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Delete failed");
      await loadItems();
    } catch (err) {
      showBanner("Couldn't delete this item. Please try again.", "error");
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const analyzer = document.getElementById("analyzer").value.trim();
    const itemName = document.getElementById("itemName").value.trim();
    if (!analyzer || !itemName) {
      showBanner("Analyzer and item name are required.", "error");
      return;
    }
    const payload = {
      action: editingId ? "update" : "create",
      id: editingId || undefined,
      analyzer: analyzer,
      vendor: document.getElementById("vendor").value.trim(),
      itemName: itemName,
      packSize: document.getElementById("packSize").value.trim(),
      usageWeek: document.getElementById("usageWeek").value.trim(),
      inStock: document.getElementById("inStock").value.trim(),
      reorderLevel: document.getElementById("reorderLevel").value.trim(),
      toGet: document.getElementById("toGet").value.trim(),
      toGiveBack: document.getElementById("toGiveBack").value.trim(),
      expiry: document.getElementById("expiry").value.trim(),
    };
    saveBtn.disabled = true;
    saveBtn.textContent = editingId ? "Updating…" : "Saving…";
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Save failed");
      closeForm();
      clearBanner();
      await loadItems();
    } catch (err) {
      showBanner(editingId ? "Couldn't update this item. Please try again." : "Couldn't save this item. Please try again.", "error");
    }
    saveBtn.disabled = false;
    saveBtn.textContent = editingId ? "Update item" : "Save item";
  });

  function openDocForm() {
    docForm.reset();
    editingDocId = null;
    document.getElementById("doc-sheet-title").textContent = "New entry";
    docSaveBtn.textContent = "Save entry";
    docOverlay.classList.remove("hidden");
    document.getElementById("docDescription").focus();
  }
  function closeDocForm() {
    docOverlay.classList.add("hidden");
    docForm.reset();
    editingDocId = null;
    document.getElementById("doc-sheet-title").textContent = "New entry";
    docSaveBtn.textContent = "Save entry";
  }
  function closeDocFormBg(e) {
    if (e.target === docOverlay) closeDocForm();
  }

  function startEditDoc(id) {
    const d = allDocs.find(function (x) { return String(x.ID) === String(id); });
    if (!d) return;
    editingDocId = id;
    document.getElementById("docDate").value = toDateInputValue(d.Date);
    document.getElementById("docDescription").value = d.Description || "";
    document.getElementById("docAmount").value = d.Amount || "";
    document.getElementById("docFile").value = "";
    document.getElementById("doc-sheet-title").textContent = "Edit entry";
    docSaveBtn.textContent = "Update entry";
    docOverlay.classList.remove("hidden");
  }

  async function confirmDeleteDoc(id) {
    if (!confirm("Delete this entry? The attached PDF will also be removed. This can't be undone.")) return;
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "deleteDoc", id: id }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Delete failed");
      await loadItems();
    } catch (err) {
      showBanner("Couldn't delete this entry. Please try again.", "error");
    }
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () {
        const result = reader.result;
        const base64 = result.substring(result.indexOf(",") + 1);
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  docForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    const description = document.getElementById("docDescription").value.trim();
    if (!description) {
      showBanner("Description is required.", "error");
      return;
    }
    const fileInput = document.getElementById("docFile");
    const file = fileInput.files[0];
    docSaveBtn.disabled = true;
    docSaveBtn.textContent = editingDocId ? "Updating…" : "Saving…";
    try {
      const payload = {
        action: editingDocId ? "updateDoc" : "createDoc",
        id: editingDocId || undefined,
        analyzer: currentAnalyzer,
        category: currentCategory,
        date: document.getElementById("docDate").value,
        description: description,
        amount: document.getElementById("docAmount").value.trim(),
        fileName: "",
        fileData: "",
        mimeType: "",
      };
      if (file) {
        payload.fileName = file.name;
        payload.mimeType = file.type || "application/pdf";
        payload.fileData = await fileToBase64(file);
      }
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Save failed");
      closeDocForm();
      clearBanner();
      await loadItems();
    } catch (err) {
      showBanner("Couldn't save this entry: " + (err && err.message ? err.message : err), "error");
    }
    docSaveBtn.disabled = false;
    docSaveBtn.textContent = editingDocId ? "Update entry" : "Save entry";
  });

  setView("home");
  loadItems();
</script>

</body>
</html>
